name: RPM

on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Builds run third-party build scripts, so they only get read access. The
# release job below is the only one that can write, and only on v* tags.
permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git rpm-build rpmdevtools cargo rust gcc
          gtk4-devel libadwaita-devel desktop-file-utils

      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-fedora44-${{ hashFiles('Cargo.lock') }}

      - name: Create source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/rpmbuild/SOURCES
          git archive --format=tar.gz \
            --prefix=adb-gui-${{ steps.version.outputs.version }}/ \
            -o ~/rpmbuild/SOURCES/adb-gui-${{ steps.version.outputs.version }}.tar.gz HEAD

      - name: Build RPM
        run: |
          rpmbuild -bb packaging/adb-gui.spec \
            --define "version_override ${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/*.rpm dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: adb-gui-rpm
          path: dist/*.rpm

  release:
    needs: rpm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adb-gui-rpm
          path: dist

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
