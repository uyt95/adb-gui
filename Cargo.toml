[package]
name = "adb-gui"
version = "3.0.0"
description = "A user interface on top of the adb (Android Debug Bridge)"
license-file = "LICENSE"
edition = "2024"
rust-version = "1.92"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
